name: ChatHarbor
options:
  bundleIdPrefix: org.chatharbor
  deploymentTarget:
    iOS: '17.0'
packages:
  ChatHarborCore:
    path: ..
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
targets:
  ChatHarbor:
    type: application
    platform: iOS
    sources: [ChatHarbor]
    dependencies:
      - package: ChatHarborCore
      - target: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.chatharbor.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    entitlements:
      path: ChatHarbor/ChatHarbor.entitlements
      properties:
        com.apple.security.application-groups: [group.org.chatharbor.shared]
  ShareExtension:
    type: app-extension
    platform: iOS
    sources: [ShareExtension]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Import to ChatHarbor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 1
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.org.chatharbor.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.chatharbor.app.share
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  ChatHarbor:
    build:
      targets:
        ChatHarbor: all
